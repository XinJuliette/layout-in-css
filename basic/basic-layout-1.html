<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 1</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      body {
        display: grid;

        margin: 0;
        gap: 1em;
        padding: 1em;

        grid-template-rows: 2fr 8fr 1fr;
        grid-template-columns: 1fr 4fr;

        header {
          grid-row: 1 /1;
          grid-column: 1/-1;
        }

        nav {
          grid-row: 2/2;
          grid-column: 1/1;
        }

        main {
          grid-row: 2/2;
          grid-column: 2/2;
        }

        footer {
          grid-row: 3/3;
          grid-column: 1/-1;
        }
      }
      /* Doe hier jouw ding! */
    </style>
  </head>
  <body id="basic-layout-1">
    <header><h1>Basic Layout 1</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
