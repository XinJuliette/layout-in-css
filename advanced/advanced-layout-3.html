<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Layout 3</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
    body {
      display: grid;
      grid-template-columns: 10% 20% 1fr;
      grid-template-rows: 3rem 1fr 1fr 1fr 3rem;
      gap: 3rem;
      margin: 1.5rem;
    }
    header, nav, footer {
      height: 12em;
    }

    header {
      grid-column: 1/3;
      grid-row: 2/3;
    }

    nav {
      grid-column: 1/3;
      grid-row: 3/4;
    }

    main {
      grid-column: 2/4;
      grid-row: 1/-1;
      z-index: -1
    }

    footer {
      grid-column: 1/3;
      grid-row: 4/5;
    }
    </style>
  </head>
  <body id="advanced-layout-3">
    <header><h1>Advanced Layout 3</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
